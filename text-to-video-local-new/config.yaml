# Text-to-Video Local Configuration

# 模型选择
# 可选：modelscope, animatediff, cogvideox, stable_video_diffusion
model: modelscope

# 计算设备
# 可选：cuda, cpu (默认自动检测)
device: null

# 计算精度
# 可选：float16, float32, bfloat16
dtype: float16

# 生成参数
generation:
  # 视频时长（秒）
  duration: 5
  
  # 帧率
  fps: 8
  
  # 分辨率
  height: 256
  width: 256
  
  # 推理步数（越多质量越好，但速度越慢）
  num_inference_steps: 50
  
  # 引导系数（越高越遵循提示词，但可能降低质量）
  guidance_scale: 7.5
  
  # 负向提示词（默认值）
  negative_prompt: "bad quality, worst quality, blurry, distorted, deformed"

# 输出配置
output:
  # 默认输出目录
  directory: ./outputs
  
  # 是否自动保存
  auto_save: true
  
  # 保存格式
  format: mp4

# 性能优化
optimization:
  # 启用 xformers 加速 (NVIDIA GPU)
  xformers: true
  
  # 启用 VAE 切片（减少显存占用）
  vae_slicing: true
  
  # 启用模型 CPU offload（减少显存占用，可能降低速度）
  cpu_offload: true
  
  # 批量大小（显存不足时设置为 1）
  batch_size: 1

# 模型缓存
cache:
  # 模型下载目录
  models_dir: ./models
  
  # 是否使用缓存
  use_cache: true
