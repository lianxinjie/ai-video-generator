<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景确认 - AI 视频生成器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .scene-list {
            margin: 20px 0;
        }
        
        .scene-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .scene-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .scene-card.editing {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .scene-number {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .scene-duration {
            color: #666;
            font-size: 14px;
        }
        
        .scene-prompt {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .scene-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #666;
        }
        
        .scene-edit-form {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .scene-card.editing .scene-edit-form {
            display: block;
        }
        
        .scene-card.editing .scene-prompt,
        .scene-card.editing .scene-meta {
            display: none;
        }
        
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        input[type="number"] {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            width: 100px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #764ba2;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        
        .summary {
            font-size: 16px;
            color: #666;
        }
        
        .action-bar {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 20px;
            border-top: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        
        .action-bar button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 场景确认与编辑</h1>
            <p>查看 AI 智能生成的场景分镜，可以编辑修改</p>
        </div>
        
        <div id="loading">
            <p style="text-align: center; color: #666;">正在加载场景...</p>
        </div>
        
        <div id="sceneContainer" class="scene-list" style="display: none;"></div>
    </div>
    
    <div id="actionBar" class="action-bar" style="display: none;">
        <button class="btn btn-secondary" onclick="addScene()">+ 添加场景</button>
        <div class="summary" id="summary">共 0 个场景，总时长 0 秒</div>
        <button class="btn btn-success" onclick="confirmAndGenerate()">✓ 确认并开始生成</button>
    </div>
    
    <script>
        let scenes = [];
        let taskId = null;
        
        // 从 URL 获取参数
        const urlParams = new URLSearchParams(window.location.search);
        taskId = urlParams.get('task_id');
        
        // 加载场景
        async function loadScenes() {
            if (!taskId) {
                alert('缺少任务 ID');
                return;
            }
            
            try {
                const response = await fetch(`/api/scenes/${taskId}`);
                const data = await response.json();
                
                if (data.success) {
                    scenes = data.scenes;
                    renderScenes();
                } else {
                    alert('加载失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('加载场景失败：' + error.message);
            }
        }
        
        // 渲染场景列表
        function renderScenes() {
            const container = document.getElementById('sceneContainer');
            const totalDuration = scenes.reduce((sum, s) => sum + (s.duration || 5), 0);
            
            document.getElementById('summary').textContent = 
                `共 ${scenes.length} 个场景，总时长 ${totalDuration.toFixed(1)} 秒`;
            
            container.innerHTML = scenes.map((scene, index) => `
                <div class="scene-card" id="scene-${index}" onclick="event.target.closest('.scene-edit-form') || toggleEdit(${index})">
                    <div class="scene-header">
                        <span class="scene-number">场景 ${index + 1}</span>
                        <span class="scene-duration">${(scene.duration || 5).toFixed(1)}秒</span>
                    </div>
                    
                    <div class="scene-prompt">${scene.prompt || '无提示词'}</div>
                    
                    <div class="scene-meta">
                        ${scene.scene_type ? `<span>类型：${scene.scene_type}</span>` : ''}
                        ${scene.generation_location ? `<span>生成位置：${scene.generation_location}</span>` : ''}
                        ${scene.reference_images ? `<span>参考图：${scene.reference_images.length}张</span>` : ''}
                        ${scene.voiceover ? `<span>配音：${scene.voiceover.text ? scene.voiceover.text.substring(0, 20) : ''}...</span>` : ''}
                    </div>
                    
                    <div class="scene-edit-form" onclick="event.stopPropagation()">
                        <label>提示词:</label>
                        <textarea id="edit-prompt-${index}">${scene.prompt || ''}</textarea>
                        
                        <label>时长（秒）:</label>
                        <input type="number" id="edit-duration-${index}" 
                               value="${scene.duration || 5}" 
                               step="0.5" min="0.5">
                        
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="saveEdit(${index})">保存</button>
                            <button class="btn btn-secondary" onclick="cancelEdit(${index})">取消</button>
                            <button class="btn btn-danger" onclick="deleteScene(${index})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('actionBar').style.display = 'flex';
        }
        
        // 切换编辑模式
        function toggleEdit(index) {
            const card = document.getElementById(`scene-${index}`);
            card.classList.toggle('editing');
        }
        
        // 保存编辑
        function saveEdit(index) {
            const newPrompt = document.getElementById(`edit-prompt-${index}`).value;
            const newDuration = parseFloat(document.getElementById(`edit-duration-${index}`).value);
            
            scenes[index].prompt = newPrompt;
            scenes[index].duration = newDuration;
            
            cancelEdit(index);
            renderScenes();
        }
        
        // 取消编辑
        function cancelEdit(index) {
            const card = document.getElementById(`scene-${index}`);
            card.classList.remove('editing');
        }
        
        // 添加场景
        function addScene() {
            scenes.push({
                prompt: '新场景',
                duration: 5.0,
                scene_type: 'default',
                generation_location: 'local'
            });
            renderScenes();
        }
        
        // 删除场景
        function deleteScene(index) {
            if (confirm('确定删除这个场景吗？')) {
                scenes.splice(index, 1);
                renderScenes();
            }
        }
        
        // 确认并开始生成
        async function confirmAndGenerate() {
            if (scenes.length === 0) {
                alert('至少需要一个场景');
                return;
            }
            
            try {
                // 保存场景
                const response = await fetch('/api/scenes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        task_id: taskId,
                        scenes: scenes
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('场景已保存！\n即将在 3 秒后返回...');
                    
                    // 延迟跳转回主页面
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    alert('保存失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        }
        
        // 页面加载时获取场景
        loadScenes();
    </script>
</body>
</html>
