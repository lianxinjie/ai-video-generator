{% extends "index.html" %}

{% block additional_styles %}
<style>
    .hardware-scan-section {
        background: #f8f9ff;
        border: 2px solid #667eea;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
    }
    
    .scan-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 8px;
        font-size: 1.1em;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .scan-btn:hover {
        transform: translateY(-2px);
    }
    
    .scan-result {
        margin-top: 20px;
        padding: 15px;
        background: white;
        border-radius: 8px;
    }
    
    .hardware-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin: 20px 0;
    }
    
    .hardware-item {
        background: #f8f9ff;
        padding: 15px;
        border-radius: 8px;
        border-left: 4px solid #667eea;
    }
    
    .hardware-item h4 {
        color: #667eea;
        font-size: 0.9em;
        margin-bottom: 5px;
    }
    
    .hardware-item p {
        font-size: 1.1em;
        color: #333;
    }
    
    .recommendation-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
    }
    
    .recommendation-box h3 {
        margin-bottom: 10px;
    }
    
    .tier-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: bold;
        margin-left: 10px;
    }
    
    .tier-high { background: #48bb78; }
    .tier-mid { background: #ed8936; }
    .tier-low { background: #f56565; }
    .tier-none { background: #718096; }
    
    .tips-list {
        list-style: none;
        margin-top: 10px;
    }
    
    .tips-list li {
        padding: 5px 0;
        padding-left: 20px;
        position: relative;
    }
    
    .tips-list li:before {
        content: "✓";
        position: absolute;
        left: 0;
        color: #48bb78;
    }
    
    .warning-box {
        background: #fff5f5;
        border-left: 4px solid #f56565;
        padding: 15px;
        margin: 15px 0;
    }
    
    .loading {
        text-align: center;
        padding: 40px;
    }
    
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="hardware-scan-section">
    <h2>🔍 硬件检测与智能推荐</h2>
    <p>自动检测您的电脑配置，推荐最优生成模式</p>
    
    <button class="scan-btn" onclick="scanHardware()">
        🚀 开始硬件检测
    </button>
    
    <div id="scanResult" class="scan-result" style="display: none;">
        <div class="loading">
            <div class="spinner"></div>
            <p>正在检测硬件配置...</p>
        </div>
    </div>
</div>

<script>
async function scanHardware() {
    const resultDiv = document.getElementById('scanResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p>正在检测硬件配置，请稍候...</p>
        </div>
    `;
    
    try {
        const response = await fetch('/api/scanner/report', {
            method: 'GET'
        });
        
        const data = await response.json();
        
        if (data.success) {
            displayScanResult(data.summary);
        } else {
            resultDiv.innerHTML = `<div class="warning-box">检测失败：${data.error}</div>`;
        }
    } catch (error) {
        resultDiv.innerHTML = `<div class="warning-box">检测失败：${error.message}</div>`;
    }
}

function displayScanResult(summary) {
    const resultDiv = document.getElementById('scanResult');
    
    const cpuTier = getTierClass(summary.cpu);
    const gpuTier = getTierClass(summary.gpu);
    
    resultDiv.innerHTML = `
        <h3>📊 检测结果</h3>
        
        <div class="hardware-grid">
            <div class="hardware-item">
                <h4>CPU</h4>
                <p>${summary.cpu}</p>
            </div>
            <div class="hardware-item">
                <h4>GPU</h4>
                <p>${summary.gpu}</p>
            </div>
            <div class="hardware-item">
                <h4>显存</h4>
                <p>${summary.gpu_memory}</p>
            </div>
            <div class="hardware-item">
                <h4>内存</h4>
                <p>${summary.ram}</p>
            </div>
            <div class="hardware-item">
                <h4>可用磁盘</h4>
                <p>${summary.disk_available}</p>
            </div>
        </div>
        
        <div class="recommendation-box">
            <h3>
                🎯 推荐模式：${getModeName(summary.recommended_mode)}
                <span class="tier-badge tier-${summary.confidence}">${summary.confidence.toUpperCase()}</span>
            </h3>
            
            ${summary.warnings.length > 0 ? `
                <div class="warning-box">
                    <strong>⚠️ 注意：</strong>
                    <ul>
                        ${summary.warnings.map(w => `<li>${w}</li>`).join('')}
                    </ul>
                </div>
            ` : ''}
            
            ${summary.optimization_tips.length > 0 ? `
                <h4>💡 优化建议：</h4>
                <ul class="tips-list">
                    ${summary.optimization_tips.map(t => `<li>${t}</li>`).join('')}
                </ul>
            ` : ''}
            
            <h4>📦 可用模型：</h4>
            <p>${summary.suitable_models.join(', ') || '无推荐模型'}</p>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <button class="scan-btn" onclick="applyRecommendation('${summary.recommended_mode}')">
                ✅ 使用推荐配置
            </button>
        </div>
    `;
}

function getTierClass(component) {
    if (!component || component === '无独立 GPU' || component === 'N/A') {
        return 'none';
    }
    if (component.includes('RTX 4090') || component.includes('RTX 4080') || component.includes('A100')) {
        return 'high';
    }
    if (component.includes('RTX 30') || component.includes('RTX 20')) {
        return 'mid';
    }
    return 'low';
}

function getModeName(mode) {
    const modeMap = {
        'hybrid_high_end': 'GPU 主导 + CPU 辅助 (高端配置)',
        'hybrid_mid_range': '平衡模式 (中端配置)',
        'hybrid_low_end': '极简模式 (入门配置)',
        'gpu_mid_cpu_low': 'GPU 主导 (中端 GPU)',
        'gpu_low_cpu_mid': 'CPU 辅助为主 (低端 GPU)',
        'gpu_high_cpu_low': 'GPU 全负荷 (高端 GPU)',
        'gpu_very_low': '最低配置模式',
        'cpu_capable': '纯 CPU 模式',
        'cpu_limited': '资源不足',
        'standard': '标准模式',
        'optimized': '超优模式',
        'collaborative': '协同模式',
        'hybrid': '混合模式'
    };
    return modeMap[mode] || mode;
}

function applyRecommendation(mode) {
    // 简单映射到实际模式
    const actualMode = mode.includes('cpu') || mode.includes('low') ? 'optimized' : 
                       mode.includes('high') ? 'standard' : 'optimized';
    
    // 选择对应的模式卡片
    selectMode(actualMode);
    
    // 滚动到模式选择区域
    document.querySelector('.mode-cards').scrollIntoView({ behavior: 'smooth' });
    
    alert(`已应用推荐配置：${getModeName(mode)}`);
}
</script>
{% endblock %}
