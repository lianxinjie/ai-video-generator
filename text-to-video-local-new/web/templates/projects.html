<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 - AI 视频生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }
        .btn-danger { background: #f56565; }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .project-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .project-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.2);
        }
        .project-name {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .project-info {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }
        .project-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .project-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-load { background: #48bb78; color: white; }
        .btn-delete { background: #f56565; color: white; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .status-success { background: #c6f6d5; color: #276749; }
        .status-error { background: #fed7d7; color: #c53030; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>📁 项目管理</h1>
        <div class="subtitle">保存和管理您的 AI 视频项目</div>
        
        <div class="btn-group">
            <button class="btn" onclick="showNewProjectModal()">➕ 新建项目</button>
            <button class="btn btn-secondary" onclick="loadProjects()">🔄 刷新列表</button>
        </div>
        
        <div id="projectsList" class="projects-grid"></div>
        <div id="statusMessage" class="status-message"></div>
    </div>
    
    <!-- 新建项目模态框 -->
    <div id="newProjectModal" class="modal">
        <div class="modal-content">
            <h2>新建项目</h2>
            <div class="form-group">
                <label for="projectName">项目名称</label>
                <input type="text" id="projectName" placeholder="例如：产品介绍视频">
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn" onclick="createProject()">创建</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/projects';
        
        window.onload = loadProjects;
        
        async function loadProjects() {
            try {
                const response = await fetch(API_BASE);
                const data = await response.json();
                
                if (data.success) {
                    renderProjects(data.projects);
                } else {
                    showStatus('加载项目失败：' + data.error, 'error');
                }
            } catch (error) {
                showStatus('加载项目失败：' + error.message, 'error');
            }
        }
        
        function renderProjects(projects) {
            const container = document.getElementById('projectsList');
            if (projects.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #718096; padding: 40px;">暂无项目，点击上方按钮创建一个新项目</div>';
                return;
            }
            
            container.innerHTML = projects.map(p => `
                <div class="project-card">
                    <div class="project-name">📁 ${p.name}</div>
                    <div class="project-info">创建时间：${p.created_at || '未知'}</div>
                    <div class="project-info">提示词：${p.prompt ? p.prompt.substring(0, 50) + '...' : '无'}</div>
                    <div class="project-info">参考图：${p.reference_image ? '✓' : '✗'}</div>
                    <div class="project-info">音频：${p.audio_file ? '✓' : '✗'}</div>
                    <div class="project-actions">
                        <button class="btn-load" onclick="loadProject('${p.name}')">加载</button>
                        <button class="btn-delete" onclick="deleteProject('${p.name}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function showNewProjectModal() {
            document.getElementById('newProjectModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('newProjectModal').style.display = 'none';
            document.getElementById('projectName').value = '';
        }
        
        async function createProject() {
            const name = document.getElementById('projectName').value.trim();
            if (!name) {
                showStatus('请输入项目名称', 'error');
                return;
            }
            
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name})
                });
                const data = await response.json();
                
                if (data.success) {
                    showStatus('项目创建成功！', 'success');
                    closeModal();
                    loadProjects();
                } else {
                    showStatus('创建失败：' + data.error, 'error');
                }
            } catch (error) {
                showStatus('创建失败：' + error.message, 'error');
            }
        }
        
        async function loadProject(name) {
            try {
                const response = await fetch(`${API_BASE}/${encodeURIComponent(name)}`);
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('currentProject', name);
                    showStatus('项目加载成功！正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/?load_project=' + encodeURIComponent(name);
                    }, 1000);
                } else {
                    showStatus('加载失败：' + data.error, 'error');
                }
            } catch (error) {
                showStatus('加载失败：' + error.message, 'error');
            }
        }
        
        async function deleteProject(name) {
            if (!confirm(`确定要删除项目 "${name}" 吗？此操作不可恢复！`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/${encodeURIComponent(name)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    showStatus('项目已删除', 'success');
                    loadProjects();
                } else {
                    showStatus('删除失败：' + data.error, 'error');
                }
            } catch (error) {
                showStatus('删除失败：' + error.message, 'error');
            }
        }
        
        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'status-message status-' + type;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
