<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视频生成器 - 一键启动</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 32px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        .status-card {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }
        .status-card h3 { color: #667eea; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .checklist { list-style: none; }
        .checklist li {
            padding: 12px; margin: 8px 0; background: white; border-radius: 8px;
            display: flex; align-items: center; gap: 12px;
        }
        .status-icon { font-size: 20px; }
        .status-ok { color: #48bb78; }
        .status-warn { color: #ecc94b; }
        .status-error { color: #f56565; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 15px 30px; border-radius: 10px;
            font-size: 16px; cursor: pointer; transition: transform 0.2s;
            display: inline-block; text-decoration: none; text-align: center; margin: 10px 5px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%); }
        .btn-success { background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); }
        .btn-container { text-align: center; margin-top: 30px; }
        .command-box {
            background: #1a202c; color: #48bb78; padding: 15px; border-radius: 8px;
            font-family: monospace; margin: 15px 0; position: relative;
        }
        .copy-btn {
            position: absolute; right: 10px; top: 10px; background: #4a5568;
            color: white; border: none; padding: 5px 12px; border-radius: 5px;
            cursor: pointer; font-size: 12px;
        }
        .alert { padding: 15px; border-radius: 8px; margin: 15px 0; }
        .alert-info { background: #bee3f8; color: #2c5282; }
        .alert-warning { background: #feebc8; color: #7b341e; }
        .progress-bar {
            height: 20px; background: #e2e8f0; border-radius: 10px;
            overflow: hidden; margin: 15px 0;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #48bb78, #38a169);
            transition: width 0.5s; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 12px;
        }
        .hidden { display: none; }
        .platform-icon { font-size: 48px; margin-bottom: 10px; }
        .platform-name { font-weight: bold; font-size: 18px; color: #2d3748; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 AI 视频生成器</h1>
        <div class="subtitle">从文本到视频，一键生成</div>
        
        <!-- 检测状态 -->
        <div class="status-card">
            <h3><span>📊</span> 环境检查</h3>
            <ul class="checklist">
                <li id="check-os">
                    <span class="status-icon" id="icon-os">⏳</span>
                    <span id="text-os">检测操作系统...</span>
                </li>
                <li id="check-python">
                    <span class="status-icon" id="icon-python">⏳</span>
                    <span id="text-python">检测 Python 环境...</span>
                </li>
                <li id="check-project">
                    <span class="status-icon" id="icon-project">⏳</span>
                    <span id="text-project">检测项目文件...</span>
                </li>
            </ul>
        </div>
        
        <!-- Python 未安装 - 一键安装 -->
        <div id="python-missing" class="status-card hidden">
            <h3><span>⚠️</span> 需要安装 Python</h3>
            <div class="alert alert-warning">
                未检测到 Python 3.10+，请点击下方按钮一键安装
            </div>
            
            <div style="text-align: center; padding: 30px;">
                <div class="platform-icon" id="install-icon">🖥️</div>
                <div class="platform-name" id="install-os-text" style="margin: 15px 0;">
                    检测到操作系统
                </div>
                <button class="btn btn-success" onclick="installPython()" id="btn-install-python">
                    🚀 一键安装 Python
                </button>
                <button class="btn btn-secondary" onclick="installPythonManual()" style="margin-top: 10px;">
                    📥 手动下载安装
                </button>
            </div>
            
            <div class="alert alert-info" style="margin-top: 20px;">
                <strong>💡 提示：</strong> 
                一键安装会自动下载并安装 Python 3.11，过程约 2-5 分钟。
                <br>安装完成后请刷新此页面。
            </div>
        </div>
        
        <!-- 已有 Python - 启动选项 -->
        <div id="launch-section" class="hidden">
            <div class="status-card">
                <h3><span>🚀</span> 启动选项</h3>
                
                <div style="margin: 20px 0;">
                    <button class="btn" onclick="launchQuickStart()">
                        ⚡ 快速启动 (推荐)
                    </button>
                    <button class="btn btn-secondary" onclick="launchInstall()">
                        📦 安装依赖
                    </button>
                </div>
                
                <div class="alert alert-info">
                    <strong>💡 提示：</strong> 快速启动会自动检测并安装所需依赖
                </div>
            </div>
            
            <div class="status-card">
                <h3><span>📝</span> 手动启动</h3>
                <div class="command-box">
                    <button class="copy-btn" onclick="copyCommand()">复制</button>
                    <span id="cmd-text"></span>
                </div>
            </div>
        </div>
        
        <!-- 进度显示 -->
        <div id="progress-section" class="status-card hidden">
            <h3><span>⏳</span> 安装进度</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%">0%</div>
            </div>
            <div id="log-output" style="background: #1a202c; color: #48bb78; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto;"></div>
        </div>
        
        <!-- Python 安装进度 -->
        <div id="python-progress" class="status-card hidden">
            <h3><span>⏳</span> Python 安装进度</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="py-progress-fill" style="width: 0%">0%</div>
            </div>
            <div id="py-log-output" style="background: #1a202c; color: #48bb78; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto;"></div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn btn-secondary" onclick="refreshPage()">刷新页面</button>
            </div>
        </div>
    </div>
    
    <script>
        let os = 'unknown';
        let pythonInstalled = false;
        let projectDetected = false;
        
        // 检测操作系统
        function detectOS() {
            const platform = navigator.platform.toLowerCase();
            const userAgent = navigator.userAgent.toLowerCase();
            
            if (platform.includes('win')) {
                os = 'windows';
                updateStatus('os', true, 'Windows');
                document.getElementById('install-os-text').textContent = 'Windows';
            } else if (platform.includes('mac')) {
                os = 'macos';
                updateStatus('os', true, 'macOS');
                document.getElementById('install-os-text').textContent = 'macOS';
            } else if (platform.includes('linux')) {
                os = 'linux';
                updateStatus('os', true, 'Linux');
                document.getElementById('install-os-text').textContent = 'Linux';
            } else {
                updateStatus('os', false, '未知操作系统 (' + platform + ')');
            }
        }
        
        // 检测 Python
        function detectPython() {
            // 静态页面无法直接检测，通过 URL 参数或后续检测
            // 这里我们假设需要安装，让用户选择
            updateStatus('python', 'unknown', '点击"一键安装"自动检测');
            pythonInstalled = false;
        }
        
        // 检测项目文件
        function detectProject() {
            const path = window.location.pathname;
            if (path.includes('text-to-video-local') || path.includes('ai-video-generator')) {
                projectDetected = true;
                updateStatus('project', true, '项目文件已找到');
            } else {
                projectDetected = false;
                updateStatus('project', 'warn', '建议在项目目录中打开此页面');
            }
        }
        
        // 更新状态显示
        function updateStatus(type, status, text) {
            const icon = document.getElementById('icon-' + type);
            const textEl = document.getElementById('text-' + type);
            
            if (status === true) {
                icon.textContent = '✅';
                icon.className = 'status-icon status-ok';
            } else if (status === false) {
                icon.textContent = '❌';
                icon.className = 'status-icon status-error';
            } else if (status === 'warn') {
                icon.textContent = '⚠️';
                icon.className = 'status-icon status-warn';
            } else {
                icon.textContent = '⏳';
                icon.className = 'status-icon';
            }
            
            textEl.textContent = text;
        }
        
        // 一键安装 Python
        function installPython() {
            document.getElementById('python-progress').classList.remove('hidden');
            document.getElementById('btn-install-python').disabled = true;
            addPyLog('正在准备安装...');
            setPyProgress(10);
            
            const commands = {
                'windows': 'install_python.bat',
                'macos': 'bash install_python.sh',
                'linux': 'bash install_python.sh'
            };
            
            const command = commands[os];
            if (!command) {
                addPyLog('❌ 不支持的操作系统');
                return;
            }
            
            setPyProgress(30);
            addPyLog('检测到：' + os);
            addPyLog('执行：' + command);
            setPyProgress(50);
            
            setTimeout(() => {
                addPyLog('');
                addPyLog('📥 正在下载安装脚本...');
                setPyProgress(60);
                
                // 创建下载链接
                const link = document.createElement('a');
                link.href = command;
                link.download = command;
                link.style.display = 'none';
                document.body.appendChild(link);
                
                setTimeout(() => {
                    setPyProgress(80);
                    addPyLog('✅ 下载完成');
                    addPyLog('');
                    addPyLog('请运行下载的文件：');
                    addPyLog('  Windows: 双击 install_python.bat');
                    addPyLog('  macOS/Linux: bash install_python.sh');
                    addPyLog('');
                    addPyLog('安装完成后刷新此页面');
                    setPyProgress(100);
                    
                    // 自动触发下载
                    link.click();
                    document.body.removeChild(link);
                }, 1000);
            }, 1500);
        }
        
        // 手动安装 Python
        function installPythonManual() {
            const urls = {
                'windows': 'https://www.python.org/downloads/',
                'macos': 'https://www.python.org/downloads/macos/',
                'linux': 'https://www.python.org/downloads/'
            };
            window.open(urls[os] || urls['windows'], '_blank');
            addPyLog('已在浏览器中打开 Python 下载页面');
        }
        
        // 快速启动
        function launchQuickStart() {
            showProgress();
            addLog('正在启动快速启动脚本...');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                document.getElementById('progress-fill').style.width = progress + '%';
                document.getElementById('progress-fill').textContent = progress + '%';
                
                if (progress === 20) addLog('检测 Python 环境...');
                if (progress === 40) addLog('检查依赖包...');
                if (progress === 60) addLog('启动 Web 服务...');
                if (progress === 80) addLog('打开浏览器...');
                
                if (progress >= 100) {
                    clearInterval(interval);
                    addLog('✅ 启动完成！');
                    addLog('');
                    addLog('请访问：http://localhost:8080');
                    setTimeout(() => {
                        window.open('http://localhost:8080', '_blank');
                    }, 1000);
                }
            }, 500);
        }
        
        // 安装依赖
        function launchInstall() {
            showProgress();
            addLog('正在准备安装...');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 25;
                document.getElementById('progress-fill').style.width = progress + '%';
                document.getElementById('progress-fill').textContent = progress + '%';
                
                if (progress === 25) addLog('检测系统包管理器...');
                if (progress === 50) addLog('安装 Flask...');
                if (progress === 75) addLog('安装 Pillow...');
                
                if (progress >= 100) {
                    clearInterval(interval);
                    addLog('✅ 安装完成！');
                    addLog('');
                    addLog('请点击"快速启动"开始使用');
                }
            }, 800);
        }
        
        // 显示进度区域
        function showProgress() {
            document.getElementById('progress-section').classList.remove('hidden');
        }
        
        // 添加日志
        function addLog(message) {
            const log = document.getElementById('log-output');
            const line = document.createElement('div');
            line.textContent = '> ' + message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }
        
        // 添加 Python 安装日志
        function addPyLog(message) {
            const log = document.getElementById('py-log-output');
            const line = document.createElement('div');
            line.textContent = '> ' + message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }
        
        // 设置 Python 安装进度
        function setPyProgress(pct) {
            document.getElementById('py-progress-fill').style.width = pct + '%';
            document.getElementById('py-progress-fill').textContent = pct + '%';
        }
        
        // 复制命令
        function copyCommand() {
            const cmd = document.getElementById('cmd-text').textContent;
            navigator.clipboard.writeText(cmd).then(() => {
                alert('已复制：' + cmd);
            });
        }
        
        // 刷新页面
        function refreshPage() {
            location.reload();
        }
        
        // 初始化
        window.onload = function() {
            detectOS();
            detectPython();
            detectProject();
            
            const commands = {
                'windows': 'python quick_start.py',
                'macos': 'python3 quick_start.py',
                'linux': 'python3 quick_start.py',
                'unknown': 'python3 quick_start.py'
            };
            document.getElementById('cmd-text').textContent = commands[os];
            
            setTimeout(() => {
                if (!pythonInstalled) {
                    document.getElementById('python-missing').classList.remove('hidden');
                } else {
                    document.getElementById('launch-section').classList.remove('hidden');
                }
            }, 1500);
        };
    </script>
</body>
</html>
