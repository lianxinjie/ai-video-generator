<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视频生成器 - AI 配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        .config-section {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .config-section h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .help-text {
            font-size: 13px;
            color: #718096;
            margin-top: 5px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .status-success {
            background: #c6f6d5;
            color: #276749;
        }
        .status-error {
            background: #fed7d7;
            color: #c53030;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>⚙️ AI 配置</h1>
        <div class="subtitle">配置 AI 视频生成的各项参数</div>
        
        <form id="configForm">
            <div class="config-section">
                <h2>🎯 模型配置</h2>
                <div class="form-group">
                    <label for="model">AI 模型</label>
                    <select id="model" name="model">
                        <option value="modelscope">ModelScope (通义实验室)</option>
                        <option value="animatediff">AnimateDiff (卡通风格)</option>
                        <option value="cogvideox">CogVideoX (高质量)</option>
                        <option value="svd">Stable Video Diffusion (图转视频)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model_path">模型路径</label>
                    <input type="text" id="model_path" name="model_path" value="./models">
                </div>
                <div class="form-group">
                    <label for="precision">计算精度</label>
                    <select id="precision" name="precision">
                        <option value="fp16">FP16 (半精度)</option>
                        <option value="fp32">FP32 (全精度)</option>
                    </select>
                </div>
            </div>
            
            <div class="config-section">
                <h2>🎬 生成参数</h2>
                <div class="form-group">
                    <label for="duration">视频时长 (秒)</label>
                    <input type="number" id="duration" name="duration" min="1" max="60" value="10">
                </div>
                <div class="form-group">
                    <label for="resolution">分辨率</label>
                    <select id="resolution" name="resolution">
                        <option value="512x512">512×512</option>
                        <option value="768x768">768×768</option>
                        <option value="1024x1024">1024×1024</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fps">帧率 (FPS)</label>
                    <input type="number" id="fps" name="fps" min="8" max="60" value="24">
                </div>
            </div>
            
            <div class="config-section">
                <h2>🔧 高级设置</h2>
                <div class="form-group">
                    <label for="guidance_scale">引导系数 (Guidance Scale)</label>
                    <input type="number" id="guidance_scale" name="guidance_scale" min="1" max="20" step="0.5" value="7.5">
                    <div class="help-text">控制 AI 遵循提示词的程度，越高越接近描述</div>
                </div>
                <div class="form-group">
                    <label for="seed">随机种子 (Seed)</label>
                    <input type="number" id="seed" name="seed" value="-1" placeholder="-1 表示随机">
                    <div class="help-text">相同种子会产生相同的视频，-1 表示随机</div>
                </div>
            </div>
            
            <div class="config-section">
                <h2>☁️ 云端 AI 配置（用于场景分析）</h2>
                <div class="form-group">
                    <label for="ai_api_type">AI 服务商</label>
                    <select id="ai_api_type" name="ai_api_type">
                        <option value="qwen">通义千问 (推荐)</option>
                        <option value="openai">OpenAI (GPT)</option>
                        <option value="clove">Clove AI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ai_api_key">API Key</label>
                    <input type="password" id="ai_api_key" name="ai_api_key" placeholder="请输入 API Key">
                    <div class="help-text">通义千问：https://dashscope.console.aliyun.com/apiKey</div>
                </div>
                <div class="form-group">
                    <label for="ai_api_base">API Base URL</label>
                    <input type="text" id="ai_api_base" name="ai_api_base" value="https://dashscope.aliyuncs.com/compatible-mode/v1">
                    <div class="help-text">通义千问默认：https://dashscope.aliyuncs.com/compatible-mode/v1</div>
                </div>
                <div class="form-group">
                    <label for="ai_model_name">模型名称</label>
                    <input type="text" id="ai_model_name" name="ai_model_name" value="qwen-turbo">
                    <div class="help-text">通义千问：qwen-turbo, qwen-plus, qwen-max</div>
                </div>
                <div class="form-group">
                    <label for="ai_timeout">AI 超时时间 (秒)</label>
                    <input type="number" id="ai_timeout" name="ai_timeout" min="10" max="300" value="60">
                </div>
                <div class="form-group">
                    <label for="ai_max_retries">最大重试次数</label>
                    <input type="number" id="ai_max_retries" name="ai_max_retries" min="0" max="10" value="3">
                </div>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="loadConfig()">加载配置</button>
                <button type="button" class="btn btn-secondary" onclick="resetConfig()">重置默认</button>
                <button type="submit" class="btn">保存配置</button>
            </div>
        </form>
    </div>
    
    <script>
        const CONFIG_API = '/api/config';
        
        window.onload = function() {
            loadConfig();
            setupRangeListeners();
        };
        
        function setupRangeListeners() {
        }
        
        async function loadConfig() {
            try {
                const response = await fetch(CONFIG_API);
                const data = await response.json();
                
                if (data.success) {
                    const config = data.config;
                    document.getElementById('model').value = config.model || 'modelscope';
                    document.getElementById('model_path').value = config.model_path || './models';
                    document.getElementById('precision').value = config.precision || 'fp16';
                    document.getElementById('duration').value = config.duration || 10;
                    document.getElementById('resolution').value = config.resolution || '512x512';
                    document.getElementById('fps').value = config.fps || 24;
                    document.getElementById('guidance_scale').value = config.guidance_scale || 7.5;
                    document.getElementById('seed').value = config.seed || -1;
                    
                    // 加载云端 AI 配置
                    document.getElementById('ai_api_type').value = config.ai_api_type || 'qwen';
                    document.getElementById('ai_api_key').value = config.ai_api_key || '';
                    document.getElementById('ai_api_base').value = config.ai_api_base || 'https://dashscope.aliyuncs.com/compatible-mode/v1';
                    document.getElementById('ai_model_name').value = config.ai_model_name || 'qwen-turbo';
                    document.getElementById('ai_timeout').value = config.ai_timeout || 60;
                    document.getElementById('ai_max_retries').value = config.ai_max_retries || 3;
                    
                    showStatus('配置加载成功', 'success');
                } else {
                    showStatus('加载配置失败：' + data.error, 'error');
                }
            } catch (error) {
                console.error('Load config error:', error);
                showStatus('加载配置失败：' + error.message, 'error');
            }
        }
        
        async function saveConfig(config) {
            try {
                const response = await fetch(CONFIG_API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({config: config})
                });
                const data = await response.json();
                
                if (data.success) {
                    showStatus('配置保存成功！', 'success');
                } else {
                    showStatus('保存配置失败：' + data.error, 'error');
                }
            } catch (error) {
                showStatus('保存配置失败：' + error.message, 'error');
            }
        }
        
        function resetConfig() {
            document.getElementById('model').value = 'modelscope';
            document.getElementById('model_path').value = './models';
            document.getElementById('precision').value = 'fp16';
            document.getElementById('duration').value = 10;
            document.getElementById('resolution').value = '512x512';
            document.getElementById('fps').value = 24;
            document.getElementById('guidance_scale').value = 7.5;
            document.getElementById('seed').value = -1;
            // 重置云端 AI 配置
            document.getElementById('ai_api_type').value = 'qwen';
            document.getElementById('ai_api_key').value = '';
            document.getElementById('ai_api_base').value = 'https://dashscope.aliyuncs.com/compatible-mode/v1';
            document.getElementById('ai_model_name').value = 'qwen-turbo';
            document.getElementById('ai_timeout').value = 60;
            document.getElementById('ai_max_retries').value = 3;
            showStatus('已重置为默认配置', 'success');
        }
        
        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'status-message status-' + type;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
        
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const config = {
                model: document.getElementById('model').value,
                model_path: document.getElementById('model_path').value,
                precision: document.getElementById('precision').value,
                duration: parseInt(document.getElementById('duration').value),
                resolution: document.getElementById('resolution').value,
                fps: parseInt(document.getElementById('fps').value),
                guidance_scale: parseFloat(document.getElementById('guidance_scale').value),
                seed: parseInt(document.getElementById('seed').value),
                // 云端 AI 配置
                ai_api_type: document.getElementById('ai_api_type').value,
                ai_api_key: document.getElementById('ai_api_key').value,
                ai_api_base: document.getElementById('ai_api_base').value,
                ai_model_name: document.getElementById('ai_model_name').value,
                ai_timeout: parseInt(document.getElementById('ai_timeout').value),
                ai_max_retries: parseInt(document.getElementById('ai_max_retries').value)
            };
            saveConfig(config);
        });
    </script>
</body>
</html>
